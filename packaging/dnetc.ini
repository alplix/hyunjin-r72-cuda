; ============================================================================
; dnetc.ini - configuration for the Hyunjin RC5-72 dnetc client
;
; Hyunjin - modern CUDA-C RC5-72 core for distributed.net / Moo! Wrapper
;
; Coded by Alperen Yavuz
;
; Mirrors the moowrap dnetc-gpu-1.5.ini layout.  The client runs fully
; offline against the per-workunit in/out buffer files the wrapper supplies.
; ============================================================================

[buffers]
allow-update-from-altbuffer=no
buffer-file-basename=in
output-file-basename=out
checkpoint-filename=chkpoint

[misc]
run-work-limit=-1

[triggers]
restart-on-config-file-change=no
exit-flag-filename=exit
pause-flag-filename=pause
pause-on-no-mains-power=no

[display]
progress-indicator=off

[processor-usage]
priority=9

[networking]
disabled=yes

[logging]
log-file-type="no limit"
log-file=stderr.txt

[rc5-72]
random-subspace=1341
; Force the Hyunjin CUDA-C core (appended index 5 in the core table,
; see dnetc-integration/README.md); without this the default core is used.
core=5
